id: RR-CP-BEV-RM-018
checkpoint_id: CP-BEV-RM-018
title: 冷藏原料温度监控检查
version: "1.0"
domain: 原料贮存
category: 特殊原料管理
risk_level: Critical
purpose: 确认需要冷藏或冷冻贮存的原料（乳原料、果汁原料、微生物菌种等）在规定的温度条件下贮存，有温度连续监控记录，温度异常时有报警和处理机制。
decision_logic:
  - condition: 温度达标、记录完整、报警有处理
    result: PASS
  - condition: 温度超标但超标时段内无原料存放
    result: WARNING
    severity: Medium
  - condition: 温度记录所有数据完全一致
    result: WARNING
    severity: High
  - condition: 温度报警记录显示夜间报警但无人确认
    result: FAIL
    severity: High
  - condition: 冷库温度在临界值（如要求0-4℃，实际4-5℃）
    result: WARNING
    severity: Low
required_evidence:
  - 冷库当前温度照片
  - 温度连续监控记录（1个月）
pass_condition: 温度全程控制在要求范围内
fail_condition: 温度超标且无报警处理记录
warning_condition: 无连续温度记录或报警未处置
legal_basis:
  - REG-GB-14881
risk_description: 温度超标且无报警处理记录
typical_nonconformities:
  - 冷库温度超出规定范围
  - 无连续温度监控记录
  - 温度记录缺失多天
  - 温度报警未记录处置
  - 冷库未配备备用制冷系统或应急方案
  - 温度记录数据异常整齐（疑似造假）
recommended_actions:
  - 查证: 冷库温度超出规定范围 — 评估原料品质影响
  - 查证: 无连续温度监控记录 — 安装监控系统
  - 查证: 温度报警未记录处置 — 完善报警响应流程
output_template:
  status: PASS / WARNING / FAIL
  reason: ""
  risk_level: Critical
  laws:
    - REG-GB-14881
  recommendation: ""
