id: RR-CP-BEV-RM-024
checkpoint_id: CP-BEV-RM-024
title: 添加剂称量复核检查
version: "1.0"
domain: 食品添加剂管理
category: 添加剂称量复核
risk_level: Critical
purpose: 确认食品添加剂的称量过程有双人复核机制，称量器具经校准，称量记录真实准确，确保添加剂使用量正确。
decision_logic:
  - condition: 称量记录有双人签字、秤有校准标签
    result: PASS
  - condition: 秤有校准标签但称量记录无双人签字
    result: FAIL
    severity: High
  - condition: 称量记录中每次称量数值都为整数
    result: WARNING
    severity: Medium
  - condition: 企业使用自动称量配料系统
    result: PASS
required_evidence:
  - 添加剂称量记录（含签字）
  - 电子秤校准标签照片
pass_condition: 双人复核、设备校准、记录完整
fail_condition: 无双人复核且称量秤未校准
warning_condition: 有复核但记录不规范或称量人复核人相同
legal_basis:
  - REG-GB-14881
risk_description: 无双人复核且称量秤未校准
typical_nonconformities:
  - 无双人复核制度或记录
  - 称量记录中称量人与复核人为同一人
  - 电子秤未校准或过期
  - 称量记录无具体数值（只写"适量"）
  - 称量后未及时记录
recommended_actions:
  - 查证: 无双人复核制度或记录 — 建立双人复核机制
  - 查证: 电子秤未校准或过期 — 安排校准
  - 查证: 称量记录中称量人与复核人为同一人 — 纠正复核流程
output_template:
  status: PASS / WARNING / FAIL
  reason: ""
  risk_level: Critical
  laws:
    - REG-GB-14881
  recommendation: ""
