id: RR-CP-BEV-RM-010
checkpoint_id: CP-BEV-RM-010
title: 原料保质期与生产日期核对
version: "1.0"
domain: 原料验收
category: 感官验收
risk_level: Critical
purpose: 确认验收记录的原料生产日期和保质期信息准确，实际到货的剩余保质期符合企业规定的验收要求，不存在过期或临近过期原料入库的情况。
decision_logic:
  - condition: 记录日期与实物一致且在保质期内
    result: PASS
  - condition: 库存中发现过期原料但已隔离
    result: WARNING
    severity: Low
  - condition: 库存有过期原料且与正常原料混放
    result: FAIL
    severity: Critical
  - condition: 记录日期与实物相差较大
    result: WARNING
    severity: High
required_evidence:
  - 进货台账（生产日期/保质期栏）
  - 库存原料包装生产日期照片
pass_condition: 日期准确、无过期原料
fail_condition: 库存中发现过期原料
warning_condition: 记录日期与实际不符或未记录保质期
legal_basis:
  - REG-FOOD-SAFETY-LAW
  - REG-GB-14881
risk_description: 库存中发现过期原料
typical_nonconformities:
  - 库存中发现过期原料
  - 验收记录日期与实际不一致
  - 原料入库时已临近过期
  - 无剩余保质期验收标准
  - 未记录生产日期和保质期
recommended_actions:
  - 查证: 库存中发现过期原料 — 追溯过期原料来源
  - 查证: 验收记录日期与实际不一致 — 判断记录真实性
  - 查证: 原料入库时已临近过期 — 完善剩余保质期标准
output_template:
  status: PASS / WARNING / FAIL
  reason: ""
  risk_level: Critical
  laws:
    - REG-FOOD-SAFETY-LAW
    - REG-GB-14881
  recommendation: ""
