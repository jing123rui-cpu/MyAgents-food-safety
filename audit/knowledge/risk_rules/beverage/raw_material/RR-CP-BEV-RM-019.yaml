id: RR-CP-BEV-RM-019
checkpoint_id: CP-BEV-RM-019
title: 食品添加剂专库/专柜检查
version: "1.0"
domain: 原料贮存
category: 特殊原料管理
risk_level: Critical
purpose: 确认食品添加剂实行专库/专柜存放，有专人管理，标识清晰，防止误用和滥用。
decision_logic:
  - condition: 专库/专柜、上锁、标识清晰、有领用记录
    result: PASS
  - condition: 有专柜但未上锁
    result: WARNING
    severity: Low
  - condition: 添加剂放在开放式货架上但与其他原料分区
    result: WARNING
    severity: Medium
  - condition: 添加剂标识为"A"但内容物颜色气味不匹配
    result: FAIL
    severity: Critical
required_evidence:
  - 添加剂专库/专柜照片
  - 添加剂标识照片
pass_condition: 有专柜但有管理不到位（未上锁、标识不清）
fail_condition: 与普通原料混放或容器内容不符
warning_condition: 无专库/专柜
legal_basis:
  - REG-GB-14881
  - REG-FOOD-ADDITIVE
risk_description: 与普通原料混放或容器内容不符
typical_nonconformities:
  - 添加剂与普通原料混放
  - 无专库/专柜
  - 专柜未上锁
  - 添加剂无标识或标识不清
  - 容器上的名称与实际内容物不符
recommended_actions:
  - 查证: 添加剂与普通原料混放 — 立即纠正
  - 查证: 容器上的名称与实际内容物不符 — 停止使用确认
  - 查证: 无专库/专柜 — 设置专用存放区域
output_template:
  status: PASS / WARNING / FAIL
  reason: ""
  risk_level: Critical
  laws:
    - REG-GB-14881
    - REG-FOOD-ADDITIVE
  recommendation: ""
