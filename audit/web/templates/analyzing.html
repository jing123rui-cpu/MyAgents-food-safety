{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>智能分析进行中</h2>
    <p style="color:#666;font-size:14px;margin-bottom:20px;">正在对「{{ name }}」提交的检查问题进行智能分析，请稍候…</p>

    <div id="step-list">
        <div class="step pending" id="step-1">
            <div class="step-num">1</div>
            <div class="step-text">识别企业问题</div>
            <div class="step-status"></div>
        </div>
        <div class="step pending" id="step-2">
            <div class="step-num">2</div>
            <div class="step-text">匹配检查点</div>
            <div class="step-status"></div>
        </div>
        <div class="step pending" id="step-3">
            <div class="step-num">3</div>
            <div class="step-text">匹配风险规则</div>
            <div class="step-status"></div>
        </div>
        <div class="step pending" id="step-4">
            <div class="step-num">4</div>
            <div class="step-text">引用法规</div>
            <div class="step-status"></div>
        </div>
        <div class="step pending" id="step-5">
            <div class="step-num">5</div>
            <div class="step-text">RuleEngine 判定</div>
            <div class="step-status"></div>
        </div>
        <div class="step pending" id="step-6">
            <div class="step-num">6</div>
            <div class="step-text">企业综合判定</div>
            <div class="step-status"></div>
        </div>
    </div>

    <div id="complete-msg" class="hidden text-center mt-20">
        <p style="font-size:16px;color:#1a7a3a;font-weight:700;">分析完成</p>
        <a href="/ui/results/{{ analysis_id }}" class="btn btn-primary mt-10">查看检查结果</a>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const ANALYSIS_ID = "{{ analysis_id }}";
const POLL_INTERVAL = 1200;

const STATUS_SYMBOLS = {
    "pending": "",
    "active": '<span class="spinner"></span>',
    "done": '<span style="color:#1a7a3a;">&#10003;</span>'
};

function updateStep(n, status) {
    const el = document.getElementById("step-" + n);
    if (!el) return;
    el.className = "step " + status;
    el.querySelector(".step-status").innerHTML = STATUS_SYMBOLS[status] || "";
}

function poll() {
    fetch("/ui/analyze/status/" + ANALYSIS_ID)
        .then(r => r.json())
        .then(data => {
            const step = data.step || 0;
            for (let i = 1; i <= 6; i++) {
                if (i < step) updateStep(i, "done");
                else if (i === step) updateStep(i, "active");
                else updateStep(i, "pending");
            }
            if (data.complete) {
                updateStep(6, "done");
                document.getElementById("complete-msg").classList.remove("hidden");
            } else {
                setTimeout(poll, POLL_INTERVAL);
            }
        })
        .catch(() => setTimeout(poll, POLL_INTERVAL));
}

setTimeout(poll, 600);
</script>
{% endblock %}
